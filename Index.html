<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Copperline Distillery tokens and patterns (light, locked house look) */
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface2: #eef1f4; --line: #e2e6ea;
    --copper: #4e79a7; --copper-hi: #36597f; --copper-soft: rgba(78,121,167,.08);
    --amber: #e08b2d; --sage: #59a14f; --rust: #d65a57; --rust-soft: #fdf0ef;
    --ink: #2b3137; --ink-dim: #667085; --ink-faint: #98a2b3;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --r: 10px; --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { color: var(--ink); font: 14.5px/1.5 'Archivo', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  button, a, label { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .app { max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

  /* header: Copperline brand + sub, sticky with blur like nav.tabs */
  header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--line);
    background: rgba(246,247,249,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .brand { flex: 1; min-width: 0; }
  h1 { font-weight: 700; font-size: 20px; letter-spacing: -.01em; line-height: 1; }
  h1 em { color: var(--copper); font-style: normal; }
  .sub { color: var(--ink-dim); font-size: 11.5px; margin-top: 5px; letter-spacing: .04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink); transition: border-color .2s; }
  .iconbtn:hover { border-color: var(--copper); }
  .iconbtn:active { transform: scale(.94); }
  .uchip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px 0 10px; flex: none;
    border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-faint); }
  .uchip:hover, .uchip:focus-within { border-color: var(--copper); }
  .uchip select { appearance: none; -webkit-appearance: none; border: 0; background: none; outline: none;
    font: 600 12.5px 'Archivo', sans-serif; color: var(--ink); max-width: 88px; }

  /* step pills, styled like Copperline nav.tabs */
  nav.tabs { display: flex; gap: 6px; padding: 10px 16px 0; }
  nav.tabs span { flex: 1; text-align: center; font: 600 11.5px var(--mono); letter-spacing: .06em; color: var(--ink-faint);
    padding: 7px 0; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); transition: all .25s var(--ease); }
  nav.tabs span.done { color: var(--copper-hi); border-color: rgba(78,121,167,.35); }
  nav.tabs span.on { color: #fff; background: var(--copper); border-color: var(--copper); }

  main { flex: 1; padding: 14px 16px 20px; }
  .screen { animation: in .26s var(--ease); }
  @keyframes in { from { opacity: 0; transform: translateX(10px); } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin-bottom: 12px; }
  .ctitle { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .csub { font-size: 12px; color: var(--ink-faint); line-height: 1.45; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-dim); margin: 4px 0 10px; }
  h2 { font-size: 19px; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; margin: 2px 0 14px; }

  /* attention banner (Copperline .attn) */
  .attn { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
  .alabel { font: 600 11px var(--mono); letter-spacing: .1em; color: var(--rust); margin-right: 2px; }
  .attn a { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; font: 600 14px var(--mono);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; transition: all .2s; }
  .attn a svg { color: var(--rust); }
  .attn a:hover { border-color: var(--rust); }
  .attn a:active { transform: scale(.96); }
  .attn .emsg { flex-basis: 100%; font-size: 12px; color: var(--ink-dim); }

  /* hero + primary actions */
  .hero h2 { font-size: 24px; margin-bottom: 6px; }
  .primary { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: var(--r);
    background: var(--copper); color: #fff; font-weight: 600; font-size: 15.5px; transition: background .2s, transform .15s var(--ease); }
  .primary:hover { background: var(--copper-hi); }
  .primary:active { transform: scale(.98); }
  .primary:disabled { opacity: .55; cursor: wait; }
  .wa, .ghost-wa { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px;
    border-radius: var(--r); font-weight: 600; text-decoration: none; transition: transform .15s var(--ease); }
  .wa { background: var(--sage); color: #fff; }
  .ghost-wa { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); color: #3f7a37; }
  .ghost-wa:hover { border-color: var(--sage); }
  .wa:active, .ghost-wa:active { transform: scale(.98); }
  .note { font-size: 11.5px; color: var(--ink-faint); margin-top: 7px; text-align: center; }

  /* lift helpline card */
  .lifthead { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
  .ic { width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--copper-soft); color: var(--copper); }
  .ic.r { background: var(--rust-soft); color: var(--rust); }
  .callbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 13px; border-radius: var(--r);
    border: 1.5px solid var(--rust); color: var(--rust); text-decoration: none; font: 600 16px var(--mono); background: var(--surface); }
  .callbtn:active { transform: scale(.98); }
  .alts { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
  .alts a { font: 600 12px var(--mono); color: var(--ink-dim); text-decoration: none; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; background: var(--surface); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .notice-amber { background: #fff7ec; border-color: #f2d3a8; font-size: 13px; }
  .notice-amber b { color: #9a5a12; }

  /* category tiles: Copperline KPI cards */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-height: 104px; padding: 14px;
    text-align: left; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line);
    font-size: 13px; font-weight: 600; line-height: 1.3; transition: border-color .2s, transform .15s var(--ease); }
  .tile:hover { border-color: var(--copper); }
  .tile:active { transform: scale(.97); }
  .tile.urg::after { content: ""; position: absolute; top: 14px; right: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--rust); }
  .tile[aria-pressed=true] { border-color: var(--copper); box-shadow: inset 0 0 0 1px var(--copper); background: var(--copper-soft); }

  /* towers and areas */
  .towers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tower { aspect-ratio: 1; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all .2s; }
  .tower:hover { border-color: var(--copper); }
  .tower:active { transform: scale(.95); }
  .tower small { font-size: 10px; color: var(--ink-faint); letter-spacing: .06em; }
  .tower span { font: 600 24px var(--mono); }
  .areas { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .area { padding: 13px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line);
    font-weight: 600; font-size: 13.5px; text-align: left; transition: all .2s; }
  .area:hover { border-color: var(--copper); }
  .tower[aria-pressed=true], .area[aria-pressed=true] { border-color: var(--copper); background: var(--copper); color: #fff; }
  .tower[aria-pressed=true] small { color: rgba(255,255,255,.8); }

  .urgent { border-left: 3px solid var(--rust); }
  .urgent .ctitle { color: #a33a37; }
  .urgent .attn { margin: 12px 0 10px; padding: 0; border: 0; }
  .urgent .attn a { color: var(--rust); }

  /* fields */
  .field { margin-top: 16px; }
  .q { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
  .hint { font-weight: 400; font-size: 11.5px; color: var(--ink-faint); }
  input[type=text], input[type=tel], input[type=datetime-local], textarea, select {
    width: 100%; font: 16px 'Archivo', sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; outline: none; transition: border-color .2s, box-shadow .2s; }
  textarea { min-height: 130px; resize: vertical; }
  input:focus, textarea:focus, select:focus { border-color: var(--copper); box-shadow: 0 0 0 3px rgba(78,121,167,.13); }
  .media { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .mbtn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 10px; border-radius: var(--r);
    border: 1px dashed #c9d1da; background: var(--surface); font-weight: 600; font-size: 13.5px; color: var(--ink); cursor: pointer; }
  .mbtn:hover { border-color: var(--copper); }
  .mbtn:active { transform: scale(.97); }
  .mbtn.live { border-style: solid; border-color: var(--rust); color: var(--rust); }
  .mbtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rust); }
  .mbtn.live .dot { animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  .mbtn input { display: none; }
  .voicebar { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .voicebar audio { flex: 1; height: 40px; min-width: 0; }
  .timer { font: 600 12.5px var(--mono); color: var(--rust); }
  .thumbs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .thumbs img { width: 66px; height: 66px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .mhint { font-size: 11.5px; color: var(--ink-faint); margin-top: 8px; }

  .seg { display: inline-flex; gap: 6px; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { cursor: pointer; padding: 10px 24px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); transition: all .2s; }
  .seg label:hover { color: var(--copper-hi); border-color: var(--copper); }
  .seg input:checked + label { background: var(--copper); border-color: var(--copper); color: #fff; font-weight: 600; }
  .seg input:focus-visible + label { box-shadow: 0 0 0 3px rgba(78,121,167,.25); }
  .subbox { background: var(--surface2); border-radius: var(--r); padding: 12px; margin-top: 10px; }
  .subbox .field:first-child { margin-top: 0; }

  details.card { padding: 14px 16px; }
  summary { cursor: pointer; font-weight: 600; font-size: 14px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font: 600 15px var(--mono); color: var(--ink-faint); }
  details[open] summary::after { content: "\2212"; }
  details h3 { font-size: 12.5px; font-weight: 600; margin: 14px 0 3px; }
  details p { font-size: 12.5px; color: var(--ink-dim); }

  /* bottom action bar */
  .bar { position: sticky; bottom: 0; z-index: 30; padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(246,247,249,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
  .error { color: var(--rust); font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .error:empty { display: none; }

  /* done */
  .done { text-align: center; }
  .live { display: inline-flex; align-items: center; gap: 7px; background: var(--surface2); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px; font: 600 13px 'Archivo', sans-serif; color: #3f7a37; margin: 8px 0 14px; text-align: left; }
  .dotlive { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); animation: ring 1.8s infinite; }
  @keyframes ring { 0%,100% { box-shadow: 0 0 0 0 rgba(89,161,79,.5); } 50% { box-shadow: 0 0 0 6px rgba(89,161,79,0); } }
  .ticket { font: 600 30px var(--mono); color: var(--copper-hi); letter-spacing: -.01em; margin: 4px 0 8px; }
  .done .csub { margin-bottom: 18px; font-size: 13px; color: var(--ink-dim); }

  .disc { display: flex; gap: 8px; align-items: flex-start; font-size: 11.5px; color: var(--ink-dim); margin-top: 14px; line-height: 1.45; }
  .disc svg { flex: none; margin-top: 2px; color: var(--ink-faint); }
  .emhead { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; }
  .contacts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .ct { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: var(--r); background: var(--surface);
    border: 1px solid var(--line); text-decoration: none; color: var(--ink); transition: border-color .2s, transform .15s var(--ease); }
  .ct:hover { border-color: var(--rust); }
  .ct:active { transform: scale(.97); }
  .ct .ic { width: 36px; height: 36px; }
  .ct small { display: block; font-size: 11.5px; color: var(--ink-dim); line-height: 1.25; }
  .ct b { display: block; font: 600 18px var(--mono); color: var(--rust); }
  .ct.hero { grid-column: span 2; background: var(--rust); border-color: var(--rust); color: #fff; padding: 16px; }
  .ct.hero .ic { background: rgba(255,255,255,.18); color: #fff; }
  .ct.hero small { color: rgba(255,255,255,.9); font-size: 13px; }
  .ct.hero b { color: #fff; font-size: 26px; }
  .linkbtn { color: var(--copper-hi); font-weight: 600; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
  .linkbtn.about { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 10px 0 2px; text-decoration: none; }
  .homelink { font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; }
  .homebtn { margin-top: 14px; background: var(--surface); color: var(--copper-hi); border: 1px solid var(--line); }
  .homebtn:hover { background: var(--surface); border-color: var(--copper); }
  .linkbtn.again { display: block; margin: 16px auto 0; }
  .disc.center { justify-content: center; text-align: center; margin-top: 6px; }
  .phoneup { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--copper-hi); background: var(--copper-soft);
    border-radius: var(--r); padding: 10px 12px; margin-top: 4px; }
  .phoneup svg { flex: none; margin-top: 2px; }
  .noticeline { font-size: 12.5px; color: var(--ink-dim); margin-top: 14px; }
  dialog.sheet { margin: auto auto 0; width: 100%; max-width: 520px; max-height: 86vh; overflow-y: auto; border: 0;
    border-radius: 18px 18px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom)); background: var(--bg);
    box-shadow: 0 -10px 40px rgba(25,32,40,.18); }
  dialog.sheet[open] { animation: up .28s var(--ease); }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  dialog.sheet::backdrop { background: rgba(25,32,40,.35); }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 10px; }
  .sheet .close { position: sticky; top: 0; float: right; margin-left: 8px; }
  .sheet h2 { margin-top: 6px; }
  .sheet h3 { font-size: 12.5px; font-weight: 600; margin: 14px 0 3px; }
  .sheet #notice p { font-size: 12.5px; color: var(--ink-dim); }
  .hp { position: absolute; left: -9999px; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="iconbtn" id="backBtn" type="button" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="brand"><h1><button type="button" class="homelink" id="brandHome">Resident <em>Safety</em></button></h1><div class="sub" id="org"></div></div>
    <label class="uchip">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
      <select id="lang" aria-label="Language"></select>
    </label>
  </header>
  <nav class="tabs" id="steps" hidden><span>01</span><span>02</span><span>03</span></nav>

  <main>
    <!-- HOME: emergency contacts, then one Report button -->
    <section class="screen" data-screen="home">
      <div class="emhead"><span class="alabel">SOS</span><span class="ctitle" data-i="em_title"></span></div>
      <div class="contacts" id="contacts"></div>
      <div class="card" data-lift></div>
      <p class="phoneup"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg><span data-i="phone_note"></span></p>
      <button class="linkbtn about" type="button" id="aboutBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span data-i="about"></span></button>
      <p class="disc center"><span data-i="disc"></span></p>
    </section>

    <!-- STEP 1: WHAT -->
    <section class="screen" data-screen="what" hidden>
      <h2 data-i="q_category"></h2>
      <div class="tiles" id="catGrid"></div>
    </section>

    <!-- STEP 2: WHERE -->
    <section class="screen" data-screen="where" hidden>
      <div class="card urgent" id="urgentBox" hidden>
        <div class="ctitle" data-i="urgent_t"></div>
        <div class="csub" data-i="urgent_b"></div>
        <div class="attn">
          <a href="tel:112">112</a><a href="tel:101">101</a><a href="tel:108">108</a>
        </div>
        <div data-lift id="liftUrgent"></div>
        <a class="wa" target="_blank" rel="noopener" data-wa style="margin-top:10px"><span data-i="wa_btn"></span></a>
      </div>
      <h2 data-i="q_tower"></h2>
      <div class="towers" id="towerGrid"></div>
      <div class="areas" id="areaList"></div>
    </section>

    <!-- STEP 3: DETAILS AND SEND (one screen) -->
    <section class="screen" data-screen="send" hidden>
      <h2 data-i="q_desc"></h2>
      <textarea id="description" maxlength="2000" data-ph="desc_ph2"></textarea>
      <div class="media">
        <button type="button" class="mbtn" id="recBtn"><span class="dot"></span><span id="recLabel"></span><span class="timer" id="timer" hidden></span></button>
        <label class="mbtn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span data-i="q_photos"></span><input type="file" id="photos" accept="image/*" multiple></label>
      </div>
      <div class="voicebar" id="voiceBar" hidden>
        <audio id="player" controls></audio>
        <button type="button" class="iconbtn" id="delVoice"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <p class="mhint" id="voiceHint" data-i="voice_hint"></p>
      <p class="mhint" id="photoHint"></p>
      <div class="field">
        <label class="q" for="contact" data-i="q_phone"></label>
        <input type="tel" id="contact" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="98XXX XXXXX">
        <p class="mhint" data-i="phone_note"></p>
      </div>
      <details class="card" id="more">
        <summary data-i="more"></summary>
        <div class="field">
        <label class="q" for="spot"><span data-i="q_spot"></span> <span class="hint" data-i="spot_hint"></span></label>

<script>
const CFG = <?!= JSON.stringify(cfg) ?>;
const $ = id => document.getElementById(id);
const STEPS = ['what', 'where', 'send'];
const MAX_VOICE_SEC = 120;
const LIFT_ICON = '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 9l3-3 3 3M9 15l3 3 3-3"/>';
const ICONS = {
  'Lift stuck or not working': LIFT_ICON,
  'Lift alarm or intercom not working': '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  'Fire, smoke or burning smell': '<path d="M12 2c1 3 4 5 4 9a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 0-8z"/>',
  'Fire equipment missing or not working': '<rect x="8" y="7" width="8" height="15" rx="3"/><path d="M12 7V4h4M10 4h2"/>',
  'Fire exit or staircase blocked': '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
  'Gas leak smell': '<path d="M9.6 4.6A2 2 0 1 1 11 8H2m10.6 11.4A2 2 0 1 0 14 16H2m15.7-8.3A2.5 2.5 0 1 1 19.5 12H2"/>',
  'Electrical danger (open wires, sparks, shocks)': '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
  'Structural danger (cracks, falling plaster, broken railing)': '<path d="M4 21V5l8-3 8 3v16"/><path d="M11 7l2 3-2 3 2 3"/>',
  'Flooding or water near electrics': '<path d="M12 2.7l5.7 5.6a8 8 0 1 1-11.4 0z"/>',
  'Security or suspicious person': '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  'Danger to children (open shaft, unsafe play area)': '<circle cx="12" cy="5" r="2.5"/><path d="M12 8v7M8 11h8M10 22l2-7 2 7"/>',
};
const OTHER_ICON = '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>';
const PHONE_ICON = '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>';
const svg = (d, size = 20) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const el = (tag, props = {}, kids = []) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };

// The last tower is remembered and highlighted, but the resident still taps it: nothing is sent silently.
const state = { screen: 'home', category: '', tower: '' };
let photos = [], voice = null, voiceType = '', recorder = null, recTimer = null;

// Per-phone conveniences only. Storage can be blocked (private mode), so every call is guarded.
const local = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* not remembered, nothing breaks */ } },
};
const draft = {  // text only, this tab only: survives a reload in a weak-signal lift, gone after sending
  save(d) { try { sessionStorage.setItem('draft', JSON.stringify(d)); } catch (e) { /* no draft kept */ } },
  load() { try { return JSON.parse(sessionStorage.getItem('draft') || 'null'); } catch (e) { return null; } },
  clear() { try { sessionStorage.removeItem('draft'); } catch (e) { /* nothing to clear */ } },
};
const buzz = () => { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) { /* no haptics */ } };
let L = (() => {
  const saved = local.get('lang');
  if (saved && I18N[saved]) return saved;
  return (navigator.languages || [navigator.language || 'en']).map(l => l.slice(0, 2)).find(l => I18N[l]) || 'en';
})();

const T = (k, vars = {}) => String((I18N[L][k] ?? I18N.en[k]) || '').replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? '');
const listLabel = (enList, key, value) => {
  const i = enList.indexOf(value);
  return (i >= 0 && I18N[L][key] && I18N[L][key][i]) || value;
};
const isUrgent = () => CFG.urgent.includes(state.category);
const isLift = () => state.category.startsWith('Lift');
const fmtPhone = n => n.replace(/^(\d{3})(\d{4})(\d{4})$/, '$1 $2 $3');

/* ---------- rendering ---------- */
function renderLift(box) {
  const [main, ...alts] = CFG.liftHelpline || [];
  if (!main) { box.hidden = true; return; }
  const head = el('div', { className: 'lifthead' });
  head.innerHTML = `<span class="ic r">${svg(LIFT_ICON)}</span>`;
  head.append(el('div', {}, [el('div', { className: 'ctitle', textContent: T('lift_call') }),
    el('div', { className: 'csub', textContent: T('lift_hint') })]));
  const call = el('a', { className: 'callbtn', href: 'tel:' + main });
  call.innerHTML = svg(PHONE_ICON, 18);
  call.append(fmtPhone(main));
  const more = el('div', { className: 'alts' }, alts.map(n => el('a', { href: 'tel:' + n, textContent: '/' + n.slice(-2) })));
  box.replaceChildren(head, call, more);
}
// National helplines first, then the lift company card (CFG.liftHelpline) below them.
const CONTACTS = [
  ['112', 'em_all', ICONS['Security or suspicious person'], true],
  ['101', 'em_fire', ICONS['Fire, smoke or burning smell']],
  ['108', 'em_amb', '<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/>'],
  ['1906', 'em_gas', ICONS['Gas leak smell']],
  ['1912', 'em_power', ICONS['Electrical danger (open wires, sparks, shocks)']],
  ['1098', 'em_child', ICONS['Danger to children (open shaft, unsafe play area)']],
];
function renderContacts() {
  $('contacts').replaceChildren(...CONTACTS.map(([num, key, icon, hero]) => {
    const a = el('a', { className: 'ct' + (hero ? ' hero' : ''), href: 'tel:' + num });
    a.innerHTML = `<span class="ic r">${svg(icon)}</span>`;
    a.append(el('span', {}, [el('small', { textContent: T(key) }), el('b', { textContent: num })]));
    return a;
  }));
}
function renderTiles() {
  $('catGrid').replaceChildren(...CFG.categories.map(v => {
    const b = el('button', { type: 'button', className: 'tile' + (CFG.urgent.includes(v) ? ' urg' : '') });
    b.setAttribute('aria-pressed', String(state.category === v));
    b.innerHTML = `<span class="ic${CFG.urgent.includes(v) ? ' r' : ''}">${svg(ICONS[v] || OTHER_ICON)}</span>`;
    b.append(listLabel(EN_CAT, 'CAT', v));
    b.onclick = () => { buzz(); state.category = v; renderTiles(); onCategory(); keepDraft(); go('where'); };
    return b;
  }));
}
function renderPlaces() {
  const pick = v => () => {
    buzz(); state.tower = v; local.set('tower', v); renderPlaces(); keepDraft();
    setTimeout(() => go('send'), 160); // tap moves on, the short pause shows the choice
  };
  const marked = v => (state.tower || local.get('tower')) === v;
  const towerWord = listLabel(EN_AREA, 'AREA', 'Tower');
  $('towerGrid').replaceChildren(...CFG.towers.filter(v => v.startsWith('Tower ')).map(v => {
    const b = el('button', { type: 'button', className: 'tower', onclick: pick(v) },
      [el('small', { textContent: towerWord }), el('span', { textContent: v.slice(6) })]);
    b.setAttribute('aria-pressed', String(marked(v)));
    return b;
  }));
  $('areaList').replaceChildren(...CFG.towers.filter(v => !v.startsWith('Tower ')).map(v => {
    const b = el('button', { type: 'button', className: 'area', onclick: pick(v), textContent: listLabel(EN_AREA, 'AREA', v) });
    b.setAttribute('aria-pressed', String(marked(v)));
    return b;
  }));
}
function renderNotice() {
  const vars = { society: CFG.society, email: CFG.email, n: CFG.maxPhotos, d: CFG.retainDays, v: CFG.version };
  const parts = [['', 'n_version'], ['n_who_h', 'n_who'], ['n_what_h', 'n_what', 'n_voice'], ['n_why_h', 'n_why'],
    ['n_sees_h', 'n_sees', 'n_wa'], ['n_long_h', 'n_long'], ['n_rights_h', 'n_rights'], ['n_others_h', 'n_others'], ['', 'n_lang']];
  const nodes = [];
  parts.forEach(([h, ...ps]) => {
    if (h) nodes.push(el('h3', { textContent: T(h) }));
    const text = ps.map(k => T(k, vars)).filter(Boolean).join(' ');
    if (text) nodes.push(el('p', { textContent: text }));
  });
  $('notice').replaceChildren(...nodes);
}
function render() {
  document.documentElement.lang = L;
  document.querySelectorAll('[data-i]').forEach(n => { n.textContent = T(n.dataset.i); });
  document.querySelectorAll('[data-ph]').forEach(n => { n.placeholder = T(n.dataset.ph); });
  document.querySelectorAll('[data-lift]').forEach(renderLift);
  $('org').textContent = CFG.society;
  $('photoHint').textContent = T('photo_hint', { n: CFG.maxPhotos });
  $('recLabel').textContent = recorder ? T('stop') : T('q_voice');
  $('backBtn').setAttribute('aria-label', T('back'));
  const keep = $('mygateOutcome').value;
  $('mygateOutcome').replaceChildren(new Option(T('pick_outcome'), ''),
    ...CFG.mygateOutcomes.map(v => new Option(listLabel(EN_OUT, 'OUT', v), v)));
  $('mygateOutcome').value = keep;
  renderContacts(); renderTiles(); renderPlaces(); renderNotice(); onCategory(); updateBar();
}

/* ---------- navigation ---------- */
function updateBar() {
  const i = STEPS.indexOf(state.screen);
  $('steps').hidden = i < 0;
  document.querySelectorAll('#steps span').forEach((s, k) => { s.className = k === i ? 'on' : k < i ? 'done' : ''; });
  $('backBtn').hidden = state.screen === 'home'; // the ticket screen gets a way back too
  $('bar').hidden = ['what', 'where', 'done'].includes(state.screen); // tiles and towers move on by themselves
  $('nextBtn').textContent = state.screen === 'home' ? T('start') : failed ? T('retry') : T('agree_send');
}
function go(screen) {
  state.screen = screen;
  document.querySelectorAll('[data-screen]').forEach(s => { s.hidden = s.dataset.screen !== screen; });
  $('err').textContent = '';
  updateBar();
  window.scrollTo(0, 0);
}
function back() {
  if (state.screen === 'done') { resetForm(); return go('home'); }
  const i = STEPS.indexOf(state.screen);
  go(i <= 0 ? 'home' : STEPS[i - 1]);
}
function onCategory() {
  // Urgent: help comes first. Lift: the Johnson Lifts line is one tap away.
  $('urgentBox').hidden = !isUrgent();
  $('liftUrgent').hidden = !isLift();
}
function openSheet(which) {
  $('aboutBody').hidden = which !== 'about';
  $('noticeBody').hidden = which !== 'notice';
  $('sheet').showModal();
  $('sheet').scrollTop = 0;
}
$('aboutBtn').onclick = () => openSheet('about');
$('noticeBtn').onclick = () => openSheet('notice');
$('sheetClose').onclick = () => $('sheet').close();
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('sheet').close(); }); // tap outside closes
function resetForm() {
  state.category = ''; state.tower = '';
  ['description', 'spot', 'when', 'mygateRef'].forEach(id => { $(id).value = ''; }); // phone stays filled in
  document.querySelectorAll('input[name=mygate]').forEach(r => { r.checked = false; });
  $('mygateMore').hidden = true;
  photos = []; $('thumbs').replaceChildren(); $('photos').value = '';
  $('delVoice').onclick();
  renderTiles(); renderPlaces(); onCategory();
}
$('againBtn').onclick = () => { resetForm(); go('what'); };
$('homeBtn').onclick = () => { resetForm(); go('home'); };
// Brand goes home from anywhere. Mid-report the typed text stays, so nothing is lost.
$('brandHome').onclick = () => { if (state.screen === 'done') resetForm(); go('home'); };
$('backBtn').onclick = back;
$('lang').replaceChildren(...Object.entries(I18N).map(([code, t]) => new Option(t._name, code)));
$('lang').value = L;
$('lang').onchange = e => { L = e.target.value; local.set('lang', L); render(); };
document.querySelectorAll('[data-wa]').forEach(a => {
  if (/^https:\/\/chat\.whatsapp\.com\//.test(CFG.safetyGroup)) a.href = CFG.safetyGroup; else a.hidden = true;
});
document.querySelectorAll('input[name=mygate]').forEach(r => r.addEventListener('change', () => {
  $('mygateMore').hidden = !$('mgYes').checked;
}));

/* ---------- photos: canvas re-draw drops EXIF, including GPS ---------- */
function toJpegBase64(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('e_photo')); };
    img.src = url;
  });
}
$('photos').addEventListener('change', async e => {
  $('err').textContent = '';
  const files = [...e.target.files].slice(0, CFG.maxPhotos);
  if (e.target.files.length > CFG.maxPhotos) $('err').textContent = T('e_photos_max', { n: CFG.maxPhotos });
  try {
    photos = await Promise.all(files.map(toJpegBase64));
  } catch (x) {
    photos = [];
    e.target.value = '';
    $('err').textContent = T('e_photo');
  }
  $('thumbs').replaceChildren(...photos.map(b64 => el('img', { src: 'data:image/jpeg;base64,' + b64, alt: '' })));
});

/* ---------- voice note: MediaRecorder, two minutes max ---------- */
if (!window.MediaRecorder || !navigator.mediaDevices) { $('recBtn').hidden = true; $('voiceHint').hidden = true; }
const blobToBase64 = blob => new Promise(res => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1]);
  r.readAsDataURL(blob);
});
function stopRecording() { if (recorder && recorder.state !== 'inactive') recorder.stop(); }
$('recBtn').addEventListener('click', async () => {
  if (recorder) return stopRecording();
  $('err').textContent = '';
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    $('err').textContent = T('e_mic');
    return;
  }
  const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  recorder = new MediaRecorder(stream, type ? { mimeType: type, audioBitsPerSecond: 32000 } : {});
  const chunks = [];
  const started = Date.now();
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    clearInterval(recTimer);
    const blob = new Blob(chunks, { type: recorder.mimeType });
    voiceType = recorder.mimeType.split(';')[0];
    voice = await blobToBase64(blob);
    recorder = null;
    $('player').src = URL.createObjectURL(blob);
    $('voiceBar').hidden = false;
    $('timer').hidden = true;
    $('recBtn').classList.remove('live');
    $('recLabel').textContent = T('q_voice');
  };
  recorder.start();
  $('recBtn').classList.add('live');
  $('recLabel').textContent = T('stop');
  $('timer').hidden = false;
  recTimer = setInterval(() => {
    const s = Math.floor((Date.now() - started) / 1000);
    $('timer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    if (s >= MAX_VOICE_SEC) stopRecording();
  }, 250);
});
$('delVoice').onclick = () => {
  voice = null; voiceType = '';
  $('voiceBar').hidden = true; $('player').removeAttribute('src');
};

/* ---------- next / send ---------- */
let failed = false;
// Same rule as normPhone_ in Code.gs: Indian mobile, +91 / 91 / 0 in front allowed.
const normPhone = v => { const d = String(v || '').replace(/[\s()-]/g, '').replace(/^(\+?91|0)(?=\d{10}$)/, ''); return /^[6-9]\d{9}$/.test(d) ? d : ''; };
function keepDraft() {
  draft.save({ category: state.category, tower: state.tower, description: $('description').value, spot: $('spot').value });
}
['description', 'spot'].forEach(id => $(id).addEventListener('input', keepDraft));
document.addEventListener('input', () => { $('err').textContent = ''; }); // a fix clears the old message
function collect() {
  const mg = document.querySelector('input[name=mygate]:checked');
  return {
    category: state.category, tower: state.tower, spot: $('spot').value, when: $('when').value,
    description: $('description').value, contact: $('contact').value, website: $('website').value,
    consent: true, photos, voice, voiceType, lang: L, // pressing 'Agree and send' under the notice line is the consent
    mygate: mg ? mg.value : '', mygateRef: $('mygateRef').value, mygateOutcome: $('mygateOutcome').value,
  };
}
// Plain English for the group, whatever language the form was in. No contact details.
function groupMessage(ticket, f) {
  return ['SAFETY ALERT ' + ticket, f.category, [f.tower, f.spot.trim()].filter(Boolean).join(', '),
    f.description.trim() || (f.voice ? '(voice note with the ticket)' : '(photo with the ticket)'),
    'Sent from the ' + CFG.society + ' app (not an official society app)'].join('\n');
}
function submit() {
  const form = collect();
  if (form.mygate === 'Yes' && !form.mygateOutcome) { $('more').open = true; return void ($('err').textContent = T('e_mygate')); }
  if (!normPhone(form.contact)) { $('contact').focus(); return void ($('err').textContent = T('e_phone')); }
  local.set('phone', form.contact.trim()); // filled in next time on this phone
  const needsDetail = form.category === 'Other safety risk' && !voice && !photos.length && form.description.trim().length < 3;
  if (needsDetail) return void ($('err').textContent = T('e_desc'));
  buzz();
  $('nextBtn').disabled = true;
  $('nextBtn').textContent = T('sending');
  google.script.run
    .withSuccessHandler(res => {
      failed = false;
      draft.clear();
      $('nextBtn').disabled = false; // ready for 'Report another'
      $('ticket').textContent = res.ticket;
      $('waShare').href = 'https://wa.me/?text=' + encodeURIComponent(groupMessage(res.ticket, form));
      go('done');
    })
    .withFailureHandler(x => {
      failed = true; // everything typed stays on screen; the button turns into Try again
      $('nextBtn').disabled = false;
      $('nextBtn').textContent = T('retry');
      const key = x && x.message && x.message.replace(/^Error:\s*/, '');
      $('err').textContent = key && key in I18N.en ? T(key) : T('e_generic');
    })
    .submit(form);
}
$('nextBtn').onclick = () => {
  if (state.screen === 'home') return go('what');
  if (state.screen === 'send') {
    if (recorder) return stopRecording(); // finish the voice note first
    submit();
  }
};

// Restore a text draft after an accidental reload, then start where it left off.
(() => {
  const d = draft.load();
  if (!d || !CFG.categories.includes(d.category)) return;
  state.category = d.category;
  state.tower = CFG.towers.includes(d.tower) ? d.tower : '';
  $('description').value = d.description || '';
  $('spot').value = d.spot || '';
})();
