  n_wa: "நீங்களே உங்கள் புகாரைப் பாதுகாப்பு WhatsApp குழுவில் பகிர்ந்தால், குழுவில் உள்ள அனைவரும் அதை உங்கள் பெயர் மற்றும் எண்ணுடன் பார்ப்பார்கள். பகிர்வது உங்கள் விருப்பம்.",
  lift_call: "லிஃப்ட் சிக்கியதா? Johnson Lifts ஐ அழைக்கவும்",
  lift_hint: "பழுது உதவி எண், Johnson Care. லிஃப்ட் உள்ளே உள்ள தகட்டில் உள்ள வேலை எண்ணைச் சொல்லுங்கள்.",
  disc: "பாதுகாப்புப் பிரச்சினைகளைச் சரிசெய்ய குடியிருப்பாளர்களின் முயற்சி. இது சொசைட்டி, அதன் குழு அல்லது Godrej Properties இன் அதிகாரப்பூர்வ செயலி அல்ல.",
  em_title: "அவசரத் தொடர்புகள்",
  em_all: "அனைத்து அவசரநிலைகள்",
  em_fire: "தீ",
  em_amb: "ஆம்புலன்ஸ்",
  em_gas: "எரிவாயு கசிவு (LPG)",
  em_power: "மின் அவசரம் (BESCOM)",
  em_child: "ஆபத்தில் குழந்தை",
  swipe: "மேலும் பார்க்க மேலே ஸ்வைப் செய்யவும்",
  urgent_t: "இது அவசரமாகத் தெரிகிறது. முதலில் உதவி பெறுங்கள்.",
  urgent_b: "இப்போதே அழைக்கவும் அல்லது பாதுகாப்புக் குழுவுக்குத் தெரிவிக்கவும். பிறகு ஒரு சிறிய புகாரை அனுப்பவும். மற்ற கேள்விகள் காத்திருக்கலாம்.",
  more: "மேலும் விவரங்கள் (விருப்பத்தேர்வு)",
  emerg: "இப்போதே அவசரநிலையா? முதலில் 112 ஐ அழைக்கவும். தீயணைப்பு 101. ஆம்புலன்ஸ் 108.",
  wa_btn: "பாதுகாப்பு WhatsApp குழுவுக்குத் தெரிவிக்கவும்",
  wa_note: "குழுவில் உள்ள அனைவருக்கும் உங்கள் பெயரும் எண்ணும் தெரியும்.",
  wa_after: "அவசரம் என்றால், இப்போதே பாதுகாப்புக் குழுவுக்கும் தெரிவிக்கவும்.",
  q_voice: "குரல் பதிவு",
  voice_hint: "(விருப்பத்தேர்வு, அதிகபட்சம் 2 நிமிடம். உங்கள் குரல் உங்களை அடையாளம் காட்டக்கூடும். தட்டச்சு செய்தால் நீங்கள் அநாமதேயமாக இருப்பீர்கள்)",
  rec: "பதிவு செய்",
  stop: "நிறுத்து",
  del: "நீக்கு",
  e_mic: "மைக்ரோஃபோனைப் பயன்படுத்த முடியவில்லை. தயவுசெய்து தட்டச்சு செய்யவும்.",
  n_voice: "நீங்கள் குரல் பதிவு செய்தால், அதையும் வைத்திருப்போம். அது புகைப்படங்களுடன் சேர்த்து அழிக்கப்படும்.",
  safe: "நாங்கள் உங்கள் பெயரைக் கேட்பதில்லை. தொடர்பு விவரங்கள் விருப்பத்தேர்வு. தரவு தொடர்பு நபர் மட்டுமே அவற்றைப் பார்ப்பார். பாதுகாப்பு WhatsApp குழுவில் பகிர நீங்கள் குழு உறுப்பினராக இருக்க வேண்டும். குழுவில் உள்ள அனைவரும் உங்கள் தொலைபேசி எண்ணைப் பார்ப்பார்கள்.",
  childT: "குழந்தைகள் வேலை செய்கிறார்களா அல்லது ஆபத்தில் உள்ளார்களா?",
  childB: "சைல்ட்லைன் 1098 அல்லது காவல்துறை 112 ஐ அழைக்கவும். உங்கள் பெயரை வெளியிட வேண்டியதில்லை. தயவுசெய்து குழந்தைகளைப் புகைப்படம் எடுக்கவோ இங்கே பதிவேற்றவோ வேண்டாம்.",
  q_category: "பிரச்சினை என்ன?", pick_category: "வகையைத் தேர்ந்தெடுக்கவும்",
  q_tower: "எங்கே?", pick_tower: "டவர் அல்லது இடத்தைத் தேர்ந்தெடுக்கவும்",
  q_spot: "சரியான இடம்", spot_hint: "(விருப்பத்தேர்வு, எ.கா. 12வது மாடி லிஃப்ட் லாபி, பேஸ்மென்ட் 2 தூண் 40)",
  q_when: "இது எப்போது நடந்தது?", optional: "(விருப்பத்தேர்வு)",
  q_desc: "என்ன நடந்தது?", desc_ph: "நபரை அல்ல, பிரச்சினையை விவரிக்கவும். இது எவ்வளவு அடிக்கடி நடக்கிறது என்றும் எழுதவும்.",
  q_photos: "புகைப்படங்கள்", photo_hint: "(விருப்பத்தேர்வு, அதிகபட்சம் {n}. பதிவேற்றும் முன் இருப்பிடத் தகவல் நீக்கப்படும்)",
  q_mygate: "இதை ஏற்கனவே MyGate இல் பதிவு செய்தீர்களா?", yes: "ஆம்", no: "இல்லை",
  q_mygate_ref: "MyGate டிக்கெட் எண்", q_mygate_out: "MyGate இல் என்ன நடந்தது?", pick_outcome: "ஒன்றைத் தேர்ந்தெடுக்கவும்",
  q_contact: "பதிலுக்கு தொலைபேசி அல்லது மின்னஞ்சல்", contact_hint: "(விருப்பத்தேர்வு, தரவு தொடர்பு நபர் மட்டுமே இதைப் பார்ப்பார்)",
  notice_summary: "தனியுரிமை அறிவிப்பு (தயவுசெய்து படிக்கவும்)",
  consent: "நான் தனியுரிமை அறிவிப்பைப் படித்துவிட்டேன். அறிவிப்பில் கூறப்பட்ட நோக்கங்களுக்காக இந்த முயற்சி இந்தப் புகாரையும் அதன் புகைப்படங்களையும் பயன்படுத்த நான் ஒப்புக்கொள்கிறேன்.",
  send: "புகாரை அனுப்பவும்", sending: "அனுப்பப்படுகிறது...",
  done1: "நன்றி. உங்கள் புகார் பதிவு செய்யப்பட்டது.",
  done2: "இந்த டிக்கெட் எண்ணை வைத்துக்கொள்ளவும். பின்தொடர, திருத்த அல்லது புகாரை நீக்க இதைக் குறிப்பிடவும்.",
  e_place: "தயவுசெய்து வகையையும் இடத்தையும் தேர்ந்தெடுக்கவும்.", e_desc: "தயவுசெய்து பிரச்சினையை இன்னும் கொஞ்சம் விரிவாக எழுதவும் அல்லது குரல் பதிவு செய்யவும்.",
  e_consent: "தயவுசெய்து தனியுரிமை அறிவிப்பைப் படித்து பெட்டியில் டிக் செய்யவும்.", e_mygate: "தயவுசெய்து MyGate கேள்விக்குப் பதிலளிக்கவும்.",
  e_photo: "இந்தப் புகைப்படத்தைப் படிக்க முடியவில்லை. வேறு புகைப்படத்தை முயற்சிக்கவும்.", e_photos_max: "முதல் {n} புகைப்படங்கள் மட்டுமே வைக்கப்பட்டன.",
  e_long: "ஒரு பதில் மிக நீளமாக உள்ளது.", e_rate: "கடந்த ஒரு மணி நேரத்தில் அதிகமான புகார்கள் வந்துள்ளன. சிறிது நேரம் கழித்து முயற்சிக்கவும்.",
  e_generic: "ஏதோ தவறு நடந்தது. மீண்டும் முயற்சிக்கவும்.",
  n_version: "பதிப்பு {v}.",
  n_who_h: "நாங்கள் யார்", n_who: "{society} தன்னார்வலர்கள் நடத்தும் குடியிருப்பாளர்களின் முயற்சி. இதைச் சொசைட்டியோ அதன் குழுவோ நடத்தவில்லை. டிஜிட்டல் தனிப்பட்ட தரவு பாதுகாப்புச் சட்டம் 2023 இன் கீழ் ஒருங்கிணைப்பாளரே தரவு நம்பகப் பொறுப்பாளர் (Data Fiduciary). தொடர்பு: {email}.",
  n_what_h: "நாங்கள் சேகரிப்பவை", n_what: "பிரச்சினையின் வகை, இடம் மற்றும் நேரம். உங்கள் விளக்கம். அதிகபட்சம் {n} புகைப்படங்கள். இதை MyGate இல் பதிவு செய்தீர்களா என்பது. நீங்கள் கொடுக்க விரும்பினால் மட்டுமே தொலைபேசி எண் அல்லது மின்னஞ்சல். நாங்கள் உங்கள் பெயரைக் கேட்பதில்லை. பதிவேற்றும் முன் புகைப்படங்கள் உங்கள் தொலைபேசியிலேயே மீண்டும் சேமிக்கப்படும். இதனால் கேமரா சேர்க்கும் இருப்பிடத் தகவல் நீங்கும்.",
  n_why_h: "ஏன்", n_why: "பிரச்சினைகளைப் பதிவு செய்ய, அவை சரியாகும் வரை பின்தொடர மற்றும் குடியிருப்பாளர்களுடன் பெயரில்லாத மொத்த எண்ணிக்கைகளைப் பகிர. உங்கள் தரவு வேறு எதற்கும் பயன்படுத்தப்படாது.",
  n_sees_h: "யார் பார்க்கிறார்கள்", n_sees: "குடியிருப்பாளர் தன்னார்வலர்களின் ஒரு சிறிய குழு புகார்களையும் புகைப்படங்களையும் பார்க்கிறது. அவர்கள் தொடர்பு விவரங்களை ஒருபோதும் பார்ப்பதில்லை. அவற்றை ஒருங்கிணைப்பாளர் மட்டுமே பார்ப்பார். தரவு ஒருங்கிணைப்பாளரின் கணக்கில் Google Drive மற்றும் Google Sheets இல் சேமிக்கப்படுகிறது. நாங்கள் அதை ஒருபோதும் விற்பதில்லை, WhatsApp குழுக்களில் பகிர்வதும் இல்லை.",
  n_long_h: "எவ்வளவு காலம் வைத்திருக்கிறோம்", n_long: "டிக்கெட் மூடப்பட்ட {d} நாட்களுக்குப் பிறகு புகைப்படங்கள், விளக்கங்கள் மற்றும் தொடர்பு விவரங்கள் அழிக்கப்படும். பெயரில்லாத எண்ணிக்கைகள் வைக்கப்படும்.",
  n_rights_h: "உங்கள் உரிமைகள்", n_rights: "நீங்கள் எப்போது வேண்டுமானாலும் ஒப்புதலைத் திரும்பப் பெறலாம். உங்கள் புகாரைப் பார்க்க, திருத்த அல்லது அழிக்கவும் கேட்கலாம். உங்கள் டிக்கெட் எண்ணுடன் {email} க்கு மின்னஞ்சல் அனுப்பவும். ஒப்புதலைத் திரும்பப் பெறுவது கொடுப்பது போலவே எளிது. உங்கள் சார்பாகச் செயல்பட ஒருவரை நியமிக்கலாம். எங்கள் பதிலில் திருப்தி இல்லையெனில் இந்தியத் தரவு பாதுகாப்பு வாரியத்திடம் புகார் செய்யலாம்.",
  n_others_h: "மற்றவர்களைப் பற்றி", n_others: "நபரை அல்ல, பிரச்சினையை விவரிக்கவும். முகங்கள், குழந்தைகள் அல்லது யாருடைய வீட்டின் உட்புறத்தின் புகைப்படங்களையும் பதிவேற்ற வேண்டாம். மக்களின் பெயரைக் குறிப்பிடும் அல்லது அவமானப்படுத்தும் புகார்களை நாங்கள் திருத்துவோம் அல்லது நீக்குவோம்.",
